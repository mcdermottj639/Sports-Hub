name: Refresh Matchup Lab data (ESPN)
on:
  schedule:
    - cron: '41 10,15,21 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/espn-lab-evidence.py', 'scripts/refresh-sports-evidence.js', '.github/workflows/espn-lab-data.yml']
  push:
    branches: [main]
    paths: ['scripts/espn-lab-evidence.py', '.github/workflows/espn-lab-data.yml']
permissions:
  contents: write
concurrency:
  group: espn-lab-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build NFL and NBA snapshot from ESPN
        run: python scripts/espn-lab-evidence.py --output /tmp/espn-lab.json
      - name: Dry-run validation (pull requests)
        if: github.event_name == 'pull_request'
        run: node scripts/refresh-sports-evidence.js /tmp/espn-lab.json
      - name: Validate and publish
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Sports Hub data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          node scripts/refresh-sports-evidence.js /tmp/espn-lab.json --write
          git add data/draftkings-evidence.json data/evidence-observations
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh Matchup Lab data from ESPN"
          git pull --rebase origin main
          git push origin HEAD:main
