<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sports-Hub responsive smoke test</title>
<style>body{margin:16px;background:#eeeae1;font:14px system-ui;color:#282820}button{padding:10px;margin:4px}iframe{display:block;height:850px;border:1px solid #aaa;max-width:100%;background:white}p{max-width:900px}</style></head>
<body><h1>Responsive smoke test</h1><p>Same production page and scripts, at exact layout widths. No seeded results or synthetic network data. This browser has its own local record.</p>
<button type="button" data-width="390" data-height="844">Phone · 390 × 844</button><button type="button" data-width="466" data-height="677">Duo short · 466 × 677</button><button type="button" data-width="960" data-height="676">Duo wide · 960 × 676</button><button type="button" data-width="1024" data-height="850">Desktop · 1024 × 850</button><p id="size">390 × 844px viewport</p>
<iframe id="app" title="Sports Hub responsive preview" src="../index.html" width="390" style="height:844px"></iframe>
<script>document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{const app=document.getElementById('app');app.width=button.dataset.width;app.style.height=button.dataset.height+'px';document.getElementById('size').textContent=button.dataset.width+' × '+button.dataset.height+'px viewport';}));</script>
</body></html>
