<!doctype html>
<html lang="en" data-palette="champagne" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Survivor League</title>
<meta name="description" content="The family survivor football league — make your pick, see the standings.">
<meta name="theme-color" content="#f3f1ec">

<!-- iOS Home Screen. An apple-touch-icon MUST be a PNG — Safari ignores an
     SVG one and falls back to a screenshot of the page, which is the last
     thing you want as grandma's icon. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Survivor">
<meta name="format-detection" content="telephone=no">
<script>
  // Palette + big-text before first paint, so nothing flashes.
  try {
    // Always open light unless the person has chosen dark on this phone.
    // Following the OS meant half the family got a dark app they never asked
    // for, and dark is the harder read for aging eyes.
    var p = localStorage.getItem('survivor:palette') || 'champagne';
    document.documentElement.setAttribute('data-palette', p);
    document.documentElement.setAttribute('data-theme', p === 'onyx' ? 'dark' : 'light');
    if (localStorage.getItem('survivor:big') === '1') document.documentElement.setAttribute('data-big', '1');
    // Paint the notch/status bar to match before the first frame.
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', p === 'onyx' ? '#14130f' : '#f3f1ec');
  } catch (e) {}
</script>
<link rel="stylesheet" href="survivor.css?v=17">
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <div class="hd-brand">
      <span class="hd-ball">🏈</span>
      <span class="hd-name">Family Survivor</span>
    </div>
    <div class="hd-right">
      <button id="big-btn" class="hd-btn" type="button" title="Bigger text" aria-label="Bigger text"><span class="hb-i">A<sup>+</sup></span><span class="hb-l">Text</span></button>
      <button id="pal-btn" class="hd-btn" type="button" title="Switch between light and dark" aria-label="Switch between light and dark"><span class="hb-i">◐</span><span class="hb-l">Theme</span></button>
    </div>
  </div>
  <div id="whoami" class="hd-who" hidden></div>
</header>

<div id="viewas" class="viewbar" hidden></div>

<nav class="tabs" id="tabs" role="tablist" hidden>
  <button role="tab" data-screen="pick"      class="tab on">Pick</button>
  <button role="tab" data-screen="standings" class="tab">Standings</button>
  <button role="tab" data-screen="history"   class="tab">My Picks</button>
  <button role="tab" data-screen="stats"     class="tab">Stats</button>
  <button role="tab" data-screen="admin"     class="tab" id="tab-admin" hidden>Admin</button>
</nav>

<main id="main">
  <div id="boot" class="boot">Loading…</div>
  <section id="s-pick"      class="screen" hidden></section>
  <section id="s-standings" class="screen" hidden></section>
  <section id="s-history"   class="screen" hidden></section>
  <section id="s-stats"     class="screen" hidden></section>
  <section id="s-admin"     class="screen" hidden></section>
</main>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Matchup details">
  <div class="sheet-back" data-close="1"></div>
  <div class="sheet-card">
    <button id="sheet-close" class="sheet-x" type="button" data-close="1" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="confirm" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cf-title">
  <div class="sheet-back" data-cfcancel="1"></div>
  <div class="sheet-card cf-card">
    <div id="confirm-body"></div>
  </div>
</div>

<footer class="ft">
  <span id="ft-mode"></span>
</footer>

<script src="survivor.js?v=19"></script>
</body>
</html>
